<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tirth Enterprises - Photo Link Generator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

.container {
    max-width: 500px;
    margin: 30px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.08);
}

h1 {
    text-align: center;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

input[type="file"] {
    width: 100%;
    padding: 14px;
    border: 2px dashed #aaa;
    border-radius: 12px;
    background: #fafafa;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.upload-btn {
    background: #111;
    color: white;
}

.copy-btn {
    background: #16803c;
    color: white;
}

.clear-btn {
    background: #e9e9e9;
    color: #222;
}

#status {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
}

#preview {
    width: 100%;
    max-height: 350px;
    object-fit: contain;
    margin-top: 20px;
    border-radius: 12px;
    display: none;
}

.link-box {
    margin-top: 20px;
    display: none;
}

.link-box input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 13px;
}

.footer {
    text-align: center;
    margin-top: 20px;
    color: #888;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="card">

<h1>TIRTH ENTERPRISES</h1>

PHOTO LINK GENERATOR
</div>

>

<input

    id="photoLink"

>

</button>

<button class="clear-btn" onclick="clearPhoto()">
    CLEAR
</button>

</div>

</div>

<div class="footer">
Tirth Enterprises © 2026
</div>

</div>
